name: Keeper tick

# GitHub Actions is the production keeper. Vercel Hobby serverless
# functions time out at 10s; Studio consensus writes take longer.
# This job runs the same runKeeperTick() against the live contract
# and the same Redis book the Next.js app uses.
#
# GitHub's own `schedule:` trigger does NOT reliably fire at high
# frequency: measured in production, a "* * * * *" (every-minute) cron
# here fired its first scheduled run 47 minutes after the workflow went
# live, then zero further scheduled runs for the next 19+ minutes -- see
# repo Actions run history, event=schedule, for the raw timestamps. That
# is GitHub throttling/dropping the schedule event under normal load, not
# a bug in this workflow, and it leaves claims stuck far longer than the
# "minutes" the product needs.
#
# Fix: don't depend on `schedule:` for cadence. The job itself loops,
# ticking every ~15s for most of its time budget, then re-dispatches a
# fresh run of itself via `workflow_dispatch` before it exits -- a
# self-relaying chain that keeps ticking continuously regardless of
# whether GitHub's scheduler cooperates. `schedule:` stays only as a
# safety net to restart the chain if a run ever fails before re-dispatching.
# Repo is public, so GitHub Actions minutes are unlimited -- a
# near-continuous runner has no billing impact here.
on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

permissions:
  actions: write

concurrency:
  group: keeper-relay
  cancel-in-progress: false

jobs:
  tick:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install
        run: npm ci
      - name: Tick loop
        env:
          ALPHA_COURT_CONTRACT_ADDRESS: ${{ secrets.ALPHA_COURT_CONTRACT_ADDRESS }}
          NEXT_PUBLIC_ALPHA_COURT_CONTRACT_ADDRESS: ${{ secrets.ALPHA_COURT_CONTRACT_ADDRESS }}
          NEXT_PUBLIC_TREASURY_ADDRESS: ${{ secrets.NEXT_PUBLIC_TREASURY_ADDRESS }}
          ALPHA_COURT_SIGNER_PRIVATE_KEY: ${{ secrets.ALPHA_COURT_SIGNER_PRIVATE_KEY }}
          UPSTASH_REDIS_REST_URL: ${{ secrets.UPSTASH_REDIS_REST_URL }}
          UPSTASH_REDIS_REST_TOKEN: ${{ secrets.UPSTASH_REDIS_REST_TOKEN }}
          KEEPER_ENABLED: "true"
          KEEPER_MIN_CLAIM_ID: ${{ secrets.KEEPER_MIN_CLAIM_ID }}
          SURF_API_KEY: ${{ secrets.SURF_API_KEY }}
        run: |
          # exit 2 from `npm run keeper` means Redis is configured but
          # unreachable (scripts/run-keeper-tick.ts's health check) --
          # this is exactly the class of outage that expired silently
          # before (Upstash's demo "start-redis" instances live 3 days
          # unless claimed). A single bad tick still can't kill a
          # 12-minute relay -- Studio itself is flaky enough that one
          # transient error is normal -- but real, PERSISTENT Redis
          # downtime now fails this run for real, so it shows up as a
          # red X in the Actions tab instead of quietly looping forever.
          end=$((SECONDS + 12*60))
          redis_down_streak=0
          while [ "$SECONDS" -lt "$end" ]; do
            npm run keeper
            code=$?
            if [ "$code" -eq 2 ]; then
              redis_down_streak=$((redis_down_streak + 1))
              echo "::warning::keeper tick $redis_down_streak: Redis configured but unreachable"
              if [ "$redis_down_streak" -ge 5 ]; then
                echo "::error::Redis has been unreachable for $redis_down_streak consecutive ticks (~75s+). Failing this run so it shows up as a failed Action instead of looping silently. See the [keeper] log line above for the real error and a reprovisioning pointer."
                exit 1
              fi
            else
              redis_down_streak=0
            fi
            sleep 15
          done
      - name: Re-dispatch to keep the relay going
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run keeper.yml --ref "${{ github.ref_name }}"
